                    keyframes: {
                        shake: {
                            '10%, 90%': { transform: 'translate3d(-1px, 0, 0)' },
                            '20%, 80%': { transform: 'translate3d(2px, 0, 0)' },
                            '30%, 50%, 70%': { transform: 'translate3d(-4px, 0, 0)' },
                            '40%, 60%': { transform: 'translate3d(4px, 0, 0)' }
                        },
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },

        .sticky-note:hover {

        @media print {

            .no-print { display: none !important; }
            .glass-panel { background: #ffffff !important; border: 1px solid #cbd5e1 !important; color: #000000 !important; box-shadow: none !important; }

                const storedData = localStorage.getItem('stifin_user_data');
                
                if (storedAuth === 'true' && storedData) {
                    setIsAuthenticated(true);
                    setUserData(JSON.parse(storedData));
                    setCurrentView('dashboard');
                } else if (storedAuth === 'true') {
                    setIsAuthenticated(true);
                    setCurrentView('onboarding');

            }, []);

            const handleLogin = (password) => {
                if (password === 'sahabatsca') {
                    localStorage.setItem('stifin_auth', 'true');
                    setIsAuthenticated(true);
                    setCurrentView('onboarding');
                    return true;
                }
                return false;
            };

            const handleLogout = () => {
                localStorage.removeItem('stifin_auth');
                localStorage.removeItem('stifin_user_data');
                setIsAuthenticated(false);
                setUserData(null);
                setCurrentView('login');
            };

            const generateDashboard = (data) => {

                if (passcodes.includes(val)) {
                    setPasscodeMsg('Passcode sudah ada!');
                    return;

                const updated = [...passcodes, val];
                setPasscodes(updated);
                localStorage.setItem('stifin_passcodes', JSON.stringify(updated));
                setNewPasscode('');
                setPasscodeMsg('Passcode berhasil ditambahkan!');
                setTimeout(() => setPasscodeMsg(''), 2500);
            };

            const handleStartEdit = (index) => {
                setEditingPasscodeIndex(index);
                setEditingPasscodeValue(passcodes[index]);
            };

            const handleSaveEdit = (index) => {
                const val = editingPasscodeValue.trim();
                if (!val) return;
                const updated = [...passcodes];
                updated[index] = val;
                setPasscodes(updated);
                localStorage.setItem('stifin_passcodes', JSON.stringify(updated));
                setEditingPasscodeIndex(null);
                setEditingPasscodeValue('');
                setPasscodeMsg('Passcode berhasil diperbarui!');
                setTimeout(() => setPasscodeMsg(''), 2500);
            };

            const handleDeletePasscode = (index) => {
                if (passcodes.length <= 1) {
                    setPasscodeMsg('Gagal hapus: Minimal harus ada 1 passcode aktif!');

                    return;

                            mode: 'no-cors',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(newSubmission)
